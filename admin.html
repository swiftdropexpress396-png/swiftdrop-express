<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftDrop Express - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.85;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b1f3a;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 13px 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3dd;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #9b1c1c;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-top: 15px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .shipment-info {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .shipment-info p {
      margin: 8px 0;
    }

    .event {
      border-left: 4px solid #0b1f3a;
      background: #f8fafc;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
    }

    .event strong {
      display: block;
      margin-bottom: 5px;
    }

    .hidden {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SwiftDrop Express</h1>
  <p>Admin Shipment Management</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      value="swiftdropexpress396@gmail.com"
      autocomplete="username"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
    >

    <button id="loginBtn">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN AREA -->
  <div id="adminArea" class="hidden">

    <!-- SEARCH -->
    <div class="card">
      <h2>Manage Shipment</h2>

      <label>Tracking Number</label>
      <input
        type="text"
        id="trackingNumber"
        placeholder="Example: SDE-000002"
      >

      <button id="searchBtn">Search Shipment</button>

      <div id="searchMessage" class="message"></div>
    </div>


    <!-- SHIPMENT DETAILS -->
    <div id="shipmentCard" class="card hidden">

      <h2>Shipment Details</h2>

      <div class="shipment-info">
        <p><strong>Tracking Number:</strong> <span id="displayTracking"></span></p>
        <p><strong>Receiver:</strong> <span id="displayReceiver"></span></p>
        <p><strong>Origin:</strong> <span id="displayOrigin"></span></p>
        <p><strong>Destination:</strong> <span id="displayDestination"></span></p>
      </div>

      <div class="grid">

        <div>
          <label>Status</label>
          <select id="status">
            <option value="Shipment Created">Shipment Created</option>
            <option value="Picked Up">Picked Up</option>
            <option value="In Transit">In Transit</option>
            <option value="International Transit">International Transit</option>
<option value="Customs Clearance">Customs Clearance</option>
            <option value="Arrived at Facility">Arrived at Facility</option>
            <option value="Out for Delivery">Out for Delivery</option>
            <option value="Delivered">Delivered</option>
            <option value="Delivery Attempted">Delivery Attempted</option>
            <option value="Delayed">Delayed</option>
          </select>
        </div>

        <div>
          <label>Current Location</label>
          <input id="currentLocation" type="text">
        </div>

      </div>

      <label>Progress (%)</label>
      <input
        id="progress"
        type="number"
        min="0"
        max="100"
      >

      <label>Estimated Delivery</label>
      <input
        id="estimatedDelivery"
        type="date"
      >

      <button id="saveShipmentBtn">Save Shipment Update</button>

      <div id="shipmentMessage" class="message"></div>

    </div>


    <!-- ADD TRACKING EVENT -->
    <div id="eventCard" class="card hidden">

      <h2>Add Tracking Event</h2>

      <label>Event Status</label>
      <select id="eventStatus">
        <option value="Shipment Created">Shipment Created</option>
        <option value="Picked Up">Picked Up</option>
        <option value="In Transit">In Transit</option>
        <option value="International Transit">International Transit</option>
<option value="Customs Clearance">Customs Clearance</option>
        <option value="Arrived at Facility">Arrived at Facility</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Delivery Attempted">Delivery Attempted</option>
        <option value="Delayed">Delayed</option>
      </select>

      <label>Location</label>
      <input
        id="eventLocation"
        type="text"
        placeholder="Example: Benin City, Edo State"
      >

      <label>Description</label>
      <textarea
        id="eventDescription"
        placeholder="Describe what happened to the shipment..."
      ></textarea>

      <div class="grid">

        <div>
          <label>Latitude (optional)</label>
          <input
            id="latitude"
            type="number"
            step="any"
            placeholder="Optional"
          >
        </div>

        <div>
          <label>Longitude (optional)</label>
          <input
            id="longitude"
            type="number"
            step="any"
            placeholder="Optional"
          >
        </div>

      </div>

      <button id="addEventBtn">Add Tracking Event</button>

      <div id="eventMessage" class="message"></div>

    </div>


    <!-- TRACKING HISTORY -->
    <div id="historyCard" class="card hidden">

      <h2>Tracking History</h2>

      <div id="history">
        <p>No tracking events yet.</p>
      </div>

    </div>


    <div class="card">
      <button id="logoutBtn" class="logout">Logout</button>
    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://vhwubwndtprchiwyvaxr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ew7AMBuWsEnIN7DX-yDesQ_toD2QZ8V";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentShipment = null;


  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = "message " + type;
    element.style.display = "block";
  }


  function hideMessage(element) {
    element.style.display = "none";
  }


  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("adminArea").classList.remove("hidden");
    } else {
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("adminArea").classList.add("hidden");
    }
  }


  document
    .getElementById("loginBtn")
    .addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("loginMessage");

      hideMessage(message);

      if (!email || !password) {
        showMessage(
          message,
          "Please enter your email and password.",
          "error"
        );
        return;
      }

      this.disabled = true;
      this.textContent = "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      this.disabled = false;
      this.textContent = "Login";

      if (error) {
        showMessage(
          message,
          "Login failed: " + error.message,
          "error"
        );
        return;
      }

      await checkSession();

    });


  document
    .getElementById("searchBtn")
    .addEventListener("click", async function() {

      const trackingNumber =
        document
          .getElementById("trackingNumber")
          .value
          .trim();

      const message =
        document.getElementById("searchMessage");

      hideMessage(message);

      if (!trackingNumber) {
        showMessage(
          message,
          "Please enter a tracking number.",
          "error"
        );
        return;
      }

      this.disabled = true;
      this.textContent = "Searching...";

      const {
        data,
        error
      } = await supabaseClient
        .from("shipments")
        .select("*")
        .eq("tracking_number", trackingNumber)
        .maybeSingle();

      this.disabled = false;
      this.textContent = "Search Shipment";

      if (error) {
        showMessage(
          message,
          "Search failed: " + error.message,
          "error"
        );
        return;
      }

      if (!data) {
        document
          .getElementById("shipmentCard")
          .classList.add("hidden");

        document
          .getElementById("eventCard")
          .classList.add("hidden");

        document
          .getElementById("historyCard")
          .classList.add("hidden");

        showMessage(
          message,
          "No shipment found.",
          "error"
        );

        return;
      }

      currentShipment = data;

      document.getElementById("displayTracking").textContent =
        data.tracking_number || "-";

      document.getElementById("displayReceiver").textContent =
        data.receiver_name || "-";

      document.getElementById("displayOrigin").textContent =
        data.origin_address || "-";

      document.getElementById("displayDestination").textContent =
        data.destination_address || "-";

      document.getElementById("status").value =
        data.status || "Shipment Created";

      document.getElementById("currentLocation").value =
        data.current_location || "";

      document.getElementById("progress").value =
        data.progress_percent ?? 0;

      document.getElementById("estimatedDelivery").value =
        data.estimated_delivery || "";

      document
        .getElementById("shipmentCard")
        .classList.remove("hidden");

      document
        .getElementById("eventCard")
        .classList.remove("hidden");

      document
        .getElementById("historyCard")
        .classList.remove("hidden");

      showMessage(
        message,
        "Shipment found.",
        "success"
      );

      await loadHistory();

    });


  document
    .getElementById("saveShipmentBtn")
    .addEventListener("click", async function() {

      if (!currentShipment) {
        return;
      }

      const message =
        document.getElementById("shipmentMessage");

      hideMessage(message);

      const status =
        document.getElementById("status").value;

      const currentLocation =
        document
          .getElementById("currentLocation")
          .value
          .trim();

      const progress =
        Number(
          document.getElementById("progress").value
        );

      const estimatedDelivery =
        document.getElementById("estimatedDelivery").value;

      if (progress < 0 || progress > 100) {
        showMessage(
          message,
          "Progress must be between 0 and 100.",
          "error"
        );
        return;
      }

      this.disabled = true;
      this.textContent = "Saving...";

      const {
        error
      } = await supabaseClient
        .from("shipments")
        .update({
          status: status,
          current_location:
            currentLocation || null,
          progress_percent: progress,
          estimated_delivery:
            estimatedDelivery || null,
          updated_at: new Date().toISOString()
        })
        .eq("id", currentShipment.id);

      this.disabled = false;
      this.textContent = "Save Shipment Update";

      if (error) {
        showMessage(
          message,
          "Update failed: " + error.message,
          "error"
        );
        return;
      }

      currentShipment.status = status;
      currentShipment.current_location =
        currentLocation || null;
      currentShipment.progress_percent = progress;
      currentShipment.estimated_delivery =
        estimatedDelivery || null;

      showMessage(
        message,
        "Shipment updated successfully.",
        "success"
      );

    });


  document
    .getElementById("addEventBtn")
    .addEventListener("click", async function() {

      if (!currentShipment) {
        return;
      }

      const message =
        document.getElementById("eventMessage");

      hideMessage(message);

      const status =
        document.getElementById("eventStatus").value;

      const location =
        document
          .getElementById("eventLocation")
          .value
          .trim();

      const description =
        document
          .getElementById("eventDescription")
          .value
          .trim();

      const latitudeValue =
        document.getElementById("latitude").value;

      const longitudeValue =
        document.getElementById("longitude").value;

      const latitude =
        latitudeValue === ""
          ? null
          : Number(latitudeValue);

      const longitude =
        longitudeValue === ""
          ? null
          : Number(longitudeValue);

      this.disabled = true;
      this.textContent = "Adding Event...";

      const {
        error
      } = await supabaseClient
        .from("tracking_events")
        .insert({
          shipment_id: currentShipment.id,
          status: status,
          location: location || null,
          description: description || null,
          latitude: latitude,
          longitude: longitude,
          is_demo: currentShipment.is_demo || false
        });

      this.disabled = false;
      this.textContent = "Add Tracking Event";

      if (error) {
        showMessage(
          message,
          "Event failed: " + error.message,
          "error"
        );
        return;
      }

      document.getElementById("eventLocation").value = "";
      document.getElementById("eventDescription").value = "";
      document.getElementById("latitude").value = "";
      document.getElementById("longitude").value = "";

      showMessage(
        message,
        "Tracking event added successfully.",
        "success"
      );

      await loadHistory();

    });


  async function loadHistory() {

    if (!currentShipment) {
      return;
    }

    const history =
      document.getElementById("history");

    history.innerHTML =
      "<p>Loading tracking history...</p>";

    const {
      data,
      error
    } = await supabaseClient
      .from("tracking_events")
      .select("*")
      .eq("shipment_id", currentShipment.id)
      .order("created_at", {
        ascending: false
      });

    if (error) {
      history.innerHTML =
        "<p>Could not load history: " +
        error.message +
        "</p>";
      return;
    }

    if (!data || data.length === 0) {
      history.innerHTML =
        "<p>No tracking events yet.</p>";
      return;
    }

    history.innerHTML = "";

    data.forEach(function(event) {

      const div =
        document.createElement("div");

      div.className = "event";

      const date =
        event.created_at
          ? new Date(event.created_at)
              .toLocaleString()
          : "";

      div.innerHTML = `
        <strong>${escapeHtml(event.status || "-")}</strong>
        <div>${escapeHtml(event.location || "-")}</div>
        <div>${escapeHtml(event.description || "")}</div>
        <small>${escapeHtml(date)}</small>
      `;

      history.appendChild(div);

    });

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  document
    .getElementById("logoutBtn")
    .addEventListener("click", async function() {

      await supabaseClient.auth.signOut();

      currentShipment = null;

      document
        .getElementById("shipmentCard")
        .classList.add("hidden");

      document
        .getElementById("eventCard")
        .classList.add("hidden");

      document
        .getElementById("historyCard")
        .classList.add("hidden");

      document
        .getElementById("loginCard")
        .classList.remove("hidden");

    });


  supabaseClient.auth.onAuthStateChange(
    function() {
      checkSession();
    }
  );


  checkSession();

</script>

</body>
</html>
